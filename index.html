<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circle Friend Compass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-shaped instrument column, compass first, tab bar at the bottom. Deliberately dark (night navigation), single theme. */
:root {
  --bg: #0A1016;
  --panel: #111A23;
  --panel-2: #16212C;
  --line: #22303D;
  --fg: #E9EEF2;
  --muted: #93A1AE;
  --gold: #F2B33D;
  --gold-ink: #1A1205;
  --ping: #7DB4FF;
  --danger: #E5484D;
  --danger-deep: #B8383C;
  --danger-bg: #2A1416;
  --danger-line: #6E2B2E;
  --danger-fg: #F4C7C8;
  --toast-bg: #E9EEF2;
  --toast-fg: #0A1016;
  --f-display: 'Oxanium', 'Saira', 'Segoe UI', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px;
  display: flex; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; box-sizing: border-box;
}
.app {
  width: 100%; max-width: 420px; height: 100%; max-height: 900px; align-self: center;
  display: flex; flex-direction: column; position: relative; overflow: hidden;
}
@media (min-width: 560px) {
  body { padding-block: 24px; }
  .app { border: 1px solid var(--line); border-radius: 28px; background: var(--bg); }
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
header.top { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 6px; }
.brand { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; }
.brand span { color: var(--gold); }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
main { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 20px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 20px 20px 10px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); }
.pad { padding: 0 16px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.h2 { font-family: var(--f-display); font-size: 22px; font-weight: 700; text-wrap: balance; }
.sub { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; max-width: 40ch; }
.intro { padding: 6px 20px 0; }

/* Compass */
.compass { position: relative; height: 290px; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; }
.compass:active { cursor: grabbing; }
.compass .layer { position: absolute; width: 260px; height: 260px; }
.ping { position: absolute; border: 2px solid var(--ping); border-radius: 50%; animation: pulse 2s ease-out infinite; pointer-events: none; }
@keyframes pulse { 0% { opacity: .65; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.12); } }
.readout { text-align: center; padding: 0 20px; }
.readout .who { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.readout .where { font-size: 13px; color: var(--muted); margin-top: 4px; }
.readout .hdg { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
.pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 14px 16px 0; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 12px; }
.pill:hover { border-color: var(--muted); }

/* Friend rows */
.friend { border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.friend.on { background: var(--panel-2); border-color: var(--gold); }
.friend-main { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 12px 14px; border: none; background: transparent; text-align: left; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; border-radius: 14px; }
.avatar { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.fname { font-size: 15px; font-weight: 600; }
.farea { font-size: 12px; color: var(--muted); }
.fmeta { text-align: right; flex-shrink: 0; }
.fband { font-size: 13px; font-weight: 500; }
.flast { font-size: 11px; color: var(--muted); }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.details { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px 62px; }
.addr { width: 100%; font-size: 12px; color: var(--gold); }
.btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 600; }
.btn.gold:hover { filter: brightness(1.08); }
.btn.red { border-color: var(--danger-line); color: var(--danger-fg); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.empty { padding: 20px; border-radius: 14px; border: 1px dashed var(--line); text-align: center; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Circle tab */
.card { margin: 16px 16px 0; padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.code-input { min-width: 0; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: var(--f-mono); font-size: 16px; letter-spacing: 0.2em; text-transform: uppercase; }
.list { margin: 0 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; min-height: 44px; }
.item .t { font-size: 14px; font-weight: 600; }
.item .d { font-size: 12px; color: var(--muted); }
label.item { cursor: pointer; }
.check { width: 22px; height: 22px; accent-color: var(--gold); flex-shrink: 0; }
.linkish { text-align: left; border: none; background: transparent; color: var(--ping); font-size: 13px; padding: 12px 14px; }

/* Safety */
.alert { margin: 16px 16px 0; padding: 16px; border-radius: 18px; background: var(--danger-bg); border: 1px solid var(--danger-line); display: flex; flex-direction: column; gap: 12px; }
.sos { position: relative; overflow: hidden; height: 66px; border-radius: 14px; border: none; background: var(--danger-deep); color: #fff; font-family: var(--f-display); font-size: 20px; font-weight: 700; letter-spacing: 0.04em; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.sos .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--danger); }
.sos .txt { position: relative; }
.alert .note { font-size: 12px; color: var(--danger-fg); line-height: 1.5; }
.alert .big { font-family: var(--f-display); font-size: 21px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.btn.white { background: #fff; border-color: #fff; color: var(--danger-bg); font-weight: 600; min-height: 52px; font-size: 15px; }
.btn.outline-red { border-color: var(--danger-fg); color: #fff; min-height: 52px; font-size: 15px; font-weight: 600; }
.vitals { margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.vital { padding: 14px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.vital .k { font-size: 11px; color: var(--muted); }
.vital .v { font-family: var(--f-mono); font-size: 24px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.vital .v.warn { color: var(--danger); }
.vital .u { font-size: 11px; color: var(--muted); }
.phone { font-family: var(--f-mono); }

/* Device */
.device { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px 0; }
.face-btn { padding: 0; border: none; background: transparent; border-radius: 50%; touch-action: manipulation; }
.face-title { font-size: 14px; font-weight: 600; text-align: center; }
.gestures { align-self: stretch; margin: 0; }
.gest { display: flex; gap: 12px; align-items: center; padding: 12px 14px; font-size: 13px; }
.gest b { width: 96px; flex-shrink: 0; font-weight: 600; }
.gest span { flex: 1; color: var(--muted); }

/* Chrome */
#toast { position: absolute; left: 16px; right: 16px; bottom: 84px; padding: 12px 16px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-fg); font-size: 13px; font-weight: 500; text-align: center; z-index: 5; }
nav.tabs { display: flex; justify-content: space-around; padding: 6px 8px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
nav.tabs button { min-height: 46px; padding: 8px 12px; border: none; background: transparent; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs button[aria-current="page"] { color: var(--gold); font-weight: 600; }
nav.tabs svg { width: 20px; height: 20px; }
.seg { display: flex; gap: 6px; justify-content: center; padding: 8px 16px 0; }
.seg button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); font-weight: 600; }
.flat { flex-direction: column; gap: 14px; }
.flat .big { position: relative; font-family: var(--f-mono); font-size: 44px; font-variant-numeric: tabular-nums; }
.tape { position: relative; width: 100%; max-width: 340px; height: 70px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.flat .hint { position: relative; }
.dests { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.dest { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: transparent; text-align: left; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.dest[aria-pressed="true"] { border-color: var(--gold); background: var(--panel-2); }
.dest small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-top: 2px; }
.bgfx { position: absolute; inset: -45%; z-index: 0; pointer-events: none; opacity: .7; transition: opacity .4s; }
.bgfx.plain { opacity: 0; }
.bgfx.map { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360' viewBox='0 0 360 360'><g fill='none' stroke='%2322303D' stroke-linecap='round'><path d='M0 60H360M0 150H360M0 250H360M0 320H360' stroke-width='2'/><path d='M40 0V360M130 0V360M230 0V360M310 0V360' stroke-width='2'/><path d='M0 200C90 170 170 120 360 40' stroke-width='5' stroke='%232A3B4B'/><path d='M85 0V360M180 0V360M0 105H360M0 290H360' stroke-width='1' stroke='%231A2631'/></g><path d='M250 260c25-18 70-12 80 12s-20 50-52 46-50-40-28-58z' fill='%2316304A'/><circle cx='60' cy='300' r='14' fill='%2314281C'/></svg>"); background-size: 360px 360px; }
.bgfx.stars { background-image: radial-gradient(1.2px 1.2px at 20px 30px, #E9EEF2, transparent), radial-gradient(1px 1px at 90px 140px, #93A1AE, transparent), radial-gradient(1.5px 1.5px at 160px 60px, #F2B33D, transparent), radial-gradient(1px 1px at 200px 190px, #E9EEF2, transparent), radial-gradient(1px 1px at 50px 210px, #7DB4FF, transparent), radial-gradient(1.2px 1.2px at 130px 100px, #93A1AE, transparent); background-size: 220px 220px; opacity: .9; }
header.top, main, nav.tabs { position: relative; z-index: 1; }
.friend-alert { margin: 16px 16px 0; padding: 14px 16px; border-radius: 14px; background: var(--danger-bg); border: 1px solid var(--danger); font-size: 13px; line-height: 1.5; }
.friend-alert b { color: #fff; font-size: 15px; }
.live-badge { color: var(--ping); }
.overlay { position: absolute; inset: 0; z-index: 6; background: rgba(10,16,22,.94); display: flex; align-items: center; justify-content: center; padding: 24px; }
.overlay form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
.overlay input { height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 16px; }
@media (prefers-reduced-motion: reduce) { .ping { animation: none; opacity: .5; } }
</style>

<div class="app">
  <div class="bgfx plain" id="bgfx" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">CIRCL<span>E</span></div>
    <div class="chip" id="chip">Sharing: area only</div>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="compass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.4 13.4 8.5 15.5 10.6 10.6z"/></svg>Compass</button>
    <button data-tab="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><circle cx="16.5" cy="10" r="2.5"/><path d="M3.5 19c.6-3 3-4.6 5.5-4.6s4.9 1.6 5.5 4.6M14.5 14.6c2.6-.4 5 .9 5.8 3.9"/></svg>Circle</button>
    <button data-tab="safety"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.4 3.1 8.1 7.5 9.5 4.4-1.4 7.5-5.1 7.5-9.5V6z"/><path d="M12 8v5M12 16v.5"/></svg>Safety</button>
    <button data-tab="device"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3.5 18.5 12 12 20.5 5.5 12z"/><circle cx="12" cy="12" r="2"/></svg>Device</button>
  </nav>
</div>

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var S = {
    tab: 'compass',
    selected: 'maya',
    revealed: null,
    friends: [
      { id: 'maya', name: 'Maya', area: 'Near Lake Elizabeth', dist: 0.2, home: 0.2, bearing: -35, last: 'Live', dot: '#F2B33D', blocked: false },
      { id: 'leo', name: 'Leo', area: 'Around Fremont BART', dist: 0.9, home: 0.9, bearing: 60, last: '2 min ago', dot: '#7DB4FF', blocked: false },
      { id: 'priya', name: 'Priya', area: 'Mission San Jose area', dist: 2.4, home: 2.4, bearing: 140, last: '5 min ago', dot: '#B9A4FF', blocked: false },
      { id: 'andre', name: 'Andre', area: 'Newark, near the mall', dist: 5.8, home: 5.8, bearing: -110, last: '12 min ago', dot: '#6FD3B5', blocked: false }
    ],
    requests: [{ id: 'jordan', name: 'Jordan', area: 'Near Ardenwood', dist: 1.6, bearing: -150, dot: '#FF9E7A' }],
    code: '',
    raidBlock: true,
    hideHome: false,
    showBlocked: false,
    unsafe: 'idle',
    cancelLeft: 10,
    hr: 74, spo2: 98, motion: 'Normal',
    autoAlert: true,
    mode: 'dial',
    bg: 'plain',
    live: false,
    myCode: '',
    friendAlerts: [],
    v2k: 'Blood oxygen', v2u: '% SpO2',
    dest: null,
    dests: [
      { id: 'lake', name: 'Lake Elizabeth', dist: 0.6, home: 0.6, bearing: -20 },
      { id: 'bart', name: 'Fremont BART', dist: 1.1, home: 1.1, bearing: 55 },
      { id: 'sfbu', name: 'SFBU campus', dist: 2.0, home: 2.0, bearing: 120 },
      { id: 'home', name: 'Home', dist: 1.4, home: 1.4, bearing: -140 }
    ]
  };

  var base = 0, heading = 0, t0 = performance.now();
  var dragging = null;
  var view = document.getElementById('view');
  var toastEl = document.getElementById('toast');
  var toastT;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function say(msg) {
    clearTimeout(toastT);
    toastEl.textContent = msg; toastEl.hidden = false;
    toastT = setTimeout(function () { toastEl.hidden = true; }, 2800);
  }
  function bandOf(x) { return x.band || band(x.dist); }
  function hook(name, data) {
    var h = window.CircleLive && window.CircleLive[name];
    if (!h) return false;
    try { return h(data) === true; } catch (err) { console.error(err); return false; }
  }
  function band(d) { return d < 0.25 ? 'Under ¼ mi' : d < 1 ? 'Under 1 mi' : d < 3 ? '1 to 3 mi' : '3+ mi'; }
  function visible() { return S.friends.filter(function (f) { return !f.blocked; }); }
  function sel() {
    var v = visible();
    return v.find(function (f) { return f.id === S.selected; }) || v[0] || null;
  }
  function target() { return S.dest ? S.dests.find(function (d) { return d.id === S.dest; }) : sel(); }
  function friendById(id) { return S.friends.find(function (f) { return f.id === id; }); }
  function addFriend(f) {
    f.last = f.last || 'Just joined'; f.home = f.dist; f.blocked = false;
    S.friends.push(f); S.selected = f.id;
  }
  function dirLabel(h) {
    var n = ((h % 360) + 360) % 360;
    return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(n / 45) % 8] + ' ' + String(Math.round(n)).padStart(3, '0') + '°';
  }
  function pingSize(d) { return Math.round(300 - Math.min(d, 6) * 35); }

  function dialSvg() {
    var ticks = '';
    for (var a = 0; a < 360; a += 15) {
      var major = a % 90 === 0, mid = a % 45 === 0;
      ticks += '<line x1="150" y1="10" x2="150" y2="' + (major ? 30 : mid ? 26 : 22) + '" stroke="' + (a === 0 ? '#F2B33D' : '#E9EEF2') + '" stroke-width="' + (major ? 3 : mid ? 2 : 1.4) + '" transform="rotate(' + a + ' 150 150)"/>';
    }
    return '<svg width="260" height="260" viewBox="0 0 300 300" role="img" aria-label="Compass dial">' +
      '<circle cx="150" cy="150" r="146" fill="#111A23" stroke="#22303D" stroke-width="2"/>' +
      '<circle cx="150" cy="150" r="112" fill="none" stroke="#1B2733" stroke-width="1"/>' +
      '<g stroke-linecap="round">' + ticks + '</g>' +
      '<g font-family="Oxanium, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#E9EEF2">' +
      '<text x="150" y="58" fill="#F2B33D">N</text><text x="250" y="158">E</text><text x="150" y="258">S</text><text x="50" y="158">W</text></g></svg>';
  }

  /* ---------- views ---------- */
  function compassView() {
    var s = sel(), v = visible(), t = target();
    var html = '<div class="seg" role="group" aria-label="Compass style"><button data-act="mode" data-m="dial" aria-pressed="' + (S.mode === 'dial') + '">Dial compass</button><button data-act="mode" data-m="flat" aria-pressed="' + (S.mode === 'flat') + '">Flat digital</button></div>';
    var ping = t ? '<div class="ping" id="ping" style="width:' + pingSize(t.dist) + 'px;height:' + pingSize(t.dist) + 'px;animation-duration:' + (0.7 + Math.min(t.dist, 6) * 0.4).toFixed(2) + 's"></div>' : '';
    if (S.mode === 'flat') {
      html += '<div class="compass flat" id="compass" aria-label="Flat digital compass. Drag sideways to turn.">' + ping + '<div class="big" id="flatHdg">' + dirLabel(heading) + '</div><svg class="tape" id="tape" viewBox="0 0 340 70" aria-hidden="true"></svg><div class="hint" id="flatTurn"></div>';
    } else {
    html += '<div class="compass" id="compass" aria-label="Compass. Drag to turn.">' + ping + '<div class="layer" id="dial">' + dialSvg() + '</div>';
    }
    if (t && S.mode !== 'flat') html += '<div class="layer" id="arrow"><svg width="260" height="260" viewBox="0 0 300 300" aria-hidden="true"><polygon points="150,76 177,170 150,155 123,170" fill="#F2B33D"/><circle cx="150" cy="150" r="7" fill="#0A1016" stroke="#F2B33D" stroke-width="3"/></svg></div>';
    html += '</div><div class="readout">';
    if (t) html += '<div class="who">' + (S.dest ? 'Walking to ' : 'Pointing to ') + esc(t.name) + '</div><div class="where">' + bandOf(t) + ' · ' + esc(S.dest ? 'Phone free walk, guided by your device' : t.area) + '</div>';
    html += '<div class="hdg" id="hdg">HDG ' + dirLabel(heading) + ' · drag to turn</div></div>';
    html += '<div class="pills"><button class="pill" data-act="walk">Walk closer (sim)</button><button class="pill" data-act="resetDist">Reset distances</button>' + (S.dest ? '<button class="pill" data-act="endWalk">End phone free walk</button>' : '') + '</div>';
    html += '<div class="section-head"><div class="label">Friends in your circle</div><div class="hint">Tap to point · hold for address</div></div><div class="pad stack">';
    v.forEach(function (f) {
      var on = s && f.id === s.id;
      html += '<div class="friend' + (on ? ' on' : '') + '">' +

      case 'fall':
        S.motion = 'Fall!'; render();
        say(S.autoAlert ? 'Fall detected. Contacts notified (simulated)' : 'Fall detected');
        setTimeout(function () { S.motion = 'Normal'; if (S.tab === 'safety') render(); }, 5000); break;
      case 'callContact': say('Calling contact… (simulated)'); break;
      case 'call911': say('This draft never dials 911. In the real app this calls emergency services.'); break;
      case 'tapFace': tapFace(); break;
      case 'pairWearable': say('Open the pendant and enter code 7KQ4XM (simulated)'); break;
      case 'prev': cycle(-1); break;
      case 'next': cycle(1); break;
    }
  });

  view.addEventListener('change', function (e) {
    if (e.target.id === 'raid') S.raidBlock = e.target.checked;
    if (e.target.id === 'home') { S.hideHome = e.target.checked; document.getElementById('chip').textContent = S.hideHome ? 'Hidden at home' : 'Sharing: area only'; }
    if (e.target.id === 'auto') S.autoAlert = e.target.checked;
    var patch = {}; patch[{ raid: 'raidBlock', home: 'hideHome', auto: 'autoAlert' }[e.target.id]] = e.target.checked;
    if (e.target.id in { raid: 1, home: 1, auto: 1 }) hook('settings', patch);
  });
  view.addEventListener('input', function (e) {
    if (e.target.id === 'code') { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9 ]/g, ''); S.code = e.target.value; }
  });
  view.addEventListener('submit', function (e) {
    e.preventDefault();
    var c = S.code.replace(/\s/g, '');
    if (c.length < 4) { say('Invite codes are at least 4 characters'); return; }
    if (hook('join', c)) { S.code = ''; render(); return; }
    addFriend({ id: 'c' + Date.now(), name: 'Friend ' + c.slice(0, 3), area: 'General area appears once they’re live', dist: +(0.5 + Math.random() * 3.5).toFixed(1), bearing: Math.round(Math.random() * 360 - 180), dot: '#FFD27A' });
    S.code = ''; render(); say('Joined with code ' + c);
  });

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (b) goTab(b.dataset.tab);
  });

  try { S.bg = localStorage.getItem('circle.bg') || S.bg; } catch (err) {}
  window.CircleApp = { S: S, render: render, say: say, sel: sel, target: target, goTab: goTab };
  render();
})();
</script>
<script src="live.js"></script>
</body>
</html>
